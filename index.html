<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Learn computer science by seeing and doing: interactive, animated concept scenes." />
    <title>visilearn</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3E%3Crect x='1' y='1' width='13' height='13' rx='3' fill='%23e3c27a' stroke='%235c5249' stroke-width='2'/%3E%3Crect x='14' y='14' width='13' height='13' rx='3' fill='%23e9b79c' stroke='%235c5249' stroke-width='2'/%3E%3Crect x='14' y='1' width='13' height='13' rx='3' fill='%23a9c4d8' stroke='%235c5249' stroke-width='2'/%3E%3C/svg%3E" />
    <!-- set theme before first paint (no flash) -->
    <script>try{var p=localStorage.getItem('visilearn.theme');var d=p==='dark'||(p!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light'}catch(e){}</script>
    <script type="module" src="/src/app/main.ts"></script>
  </head>
  <body>
    <!-- ================= NAV ================= -->
    <header class="sticky top-0 z-30 border-b-2 border-stroke bg-paper/95 backdrop-blur" x-data>
      <div class="mx-auto flex max-w-7xl items-center gap-3 px-4 py-3 sm:px-6">
        <a href="#/" class="flex items-center gap-2.5 font-mono text-lg font-bold tracking-tight" aria-label="visilearn home">
          <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
            <rect x="3" y="3" width="13" height="13" rx="3" fill="var(--shadow)"/><rect x="1" y="1" width="13" height="13" rx="3" fill="var(--mustard)" stroke="var(--stroke)" stroke-width="2"/>
            <rect x="16" y="16" width="13" height="13" rx="3" fill="var(--shadow)"/><rect x="14" y="14" width="13" height="13" rx="3" fill="var(--peach)" stroke="var(--stroke)" stroke-width="2"/>
            <rect x="16" y="3" width="13" height="13" rx="3" fill="var(--shadow)"/><rect x="14" y="1" width="13" height="13" rx="3" fill="var(--sky)" stroke="var(--stroke)" stroke-width="2"/>
          </svg>
          visilearn
        </a>
        <span class="chip hidden bg-card text-ink-soft sm:inline-flex">beta</span>
        <nav class="ml-auto flex items-center gap-2">
          <a href="#/" class="btn btn-sm hidden sm:inline-flex" x-show="$store.route.view !== 'catalog'">All topics</a>
          <a href="#/studio" class="btn btn-sm" :class="$store.route.view === 'studio' && '!bg-mustard text-on-swatch'">Studio</a>
          <a href="#/settings" class="btn btn-sm" :class="$store.route.view === 'settings' && '!bg-mustard text-on-swatch'">AI models</a>
          <button class="btn btn-sm" @click="$store.theme.cycle()" :aria-label="'Theme: ' + $store.theme.label + ' (click to change)'">
            <svg x-show="$store.theme.pref === 'light'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg x-show="$store.theme.pref === 'dark'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>
            <svg x-show="$store.theme.pref === 'system'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17z" fill="currentColor"/></svg>
            <span x-text="$store.theme.label"></span>
          </button>
        </nav>
      </div>
    </header>

    <main x-data>
      <!-- ================= CATALOG ================= -->
      <template x-if="$store.route.view === 'catalog'">
        <div x-data="catalog" x-init="document.title = 'visilearn'" class="relative mx-auto max-w-7xl px-4 pb-16 pt-8 sm:px-6"
          @dragover.prevent="dragging = true" @dragleave.self="dragging = false" @drop.prevent="dropModule($event)">
          <div x-show="dragging" x-cloak class="pointer-events-none fixed inset-4 z-40 grid place-items-center rounded-2xl border-4 border-dashed border-stroke bg-paper/85">
            <p class="font-mono text-xl font-bold">Drop a module file to import it</p>
          </div>

          <!-- hero -->
          <section class="brut grid-paper relative overflow-hidden">
            <div class="grid items-center gap-8 p-6 sm:p-10 lg:grid-cols-[1.15fr_1fr]">
              <div>
                <span class="chip bg-mint text-on-swatch">Interactive CS labs</span>
                <h1 class="mt-4 font-mono text-[clamp(2rem,4.6vw,3.4rem)] font-bold leading-[1.05] tracking-tight">
                  Learn computer science by <span class="bg-mustard px-1.5 text-on-swatch [box-decoration-break:clone]">seeing</span> &amp; <span class="bg-peach px-1.5 text-on-swatch [box-decoration-break:clone]">doing</span>.
                </h1>
                <p class="mt-4 max-w-xl text-lg text-ink-soft">Short, animated scenes you can poke at. Watch a concept move, predict what happens next, then break it and fix it yourself.</p>
                <div class="mt-6 flex flex-wrap gap-3">
                  <a href="#topics" class="btn btn-primary">Start learning <span aria-hidden="true">↓</span></a>
                  <a href="#how" class="btn">How it works</a>
                </div>
              </div>
              <!-- decorative mini-scene -->
              <svg viewBox="0 0 360 240" class="w-full max-w-md justify-self-center" aria-hidden="true">
                <line x1="70" y1="120" x2="290" y2="120" stroke="var(--stroke)" stroke-width="2.5"/>
                <circle cx="110" cy="120" r="3.5" fill="var(--card)" stroke="var(--stroke)" stroke-width="2"/><circle cx="250" cy="120" r="3.5" fill="var(--card)" stroke="var(--stroke)" stroke-width="2"/>
                <g transform="translate(70 120)"><rect x="-32" y="-32" width="64" height="64" rx="12" fill="var(--shadow)" transform="translate(4 4)"/><rect x="-32" y="-32" width="64" height="64" rx="12" fill="var(--sky)" stroke="var(--stroke)" stroke-width="2.5"/><g transform="translate(-24 -24)" fill="none" stroke="var(--on-swatch)" stroke-width="2.2" stroke-linejoin="round"><rect x="9" y="10" width="30" height="20" rx="2"/><path d="M4 36h40l-3-5H7z"/></g></g>
                <g transform="translate(180 120)"><rect x="-32" y="-32" width="64" height="64" rx="12" fill="var(--shadow)" transform="translate(4 4)"/><rect x="-32" y="-32" width="64" height="64" rx="12" fill="var(--peach)" stroke="var(--stroke)" stroke-width="2.5"/><g transform="translate(-24 -24)" fill="none" stroke="var(--on-swatch)" stroke-width="2.2"><rect x="6" y="9" width="36" height="30" rx="2"/><path d="M6 19h36M6 29h36M18 9v10M30 9v10M12 19v10M24 19v10M36 19v10M18 29v10M30 29v10"/></g></g>
                <g transform="translate(290 120)"><rect x="-32" y="-32" width="64" height="64" rx="12" fill="var(--shadow)" transform="translate(4 4)"/><rect x="-32" y="-32" width="64" height="64" rx="12" fill="var(--mint)" stroke="var(--stroke)" stroke-width="2.5"/><g transform="translate(-24 -24)" fill="none" stroke="var(--on-swatch)" stroke-width="2.2"><rect x="11" y="5" width="26" height="11" rx="2"/><rect x="11" y="18.5" width="26" height="11" rx="2"/><rect x="11" y="32" width="26" height="11" rx="2"/></g></g>
                <g><circle r="8.5" cx="2.5" cy="2.5" fill="var(--shadow)"/><circle r="8.5" fill="var(--mustard)" stroke="var(--stroke)" stroke-width="2.5"/>
                  <animateMotion dur="3.2s" repeatCount="indefinite" path="M70 120 L290 120" keyPoints="0;0.5;0.5;1" keyTimes="0;0.4;0.55;1" calcMode="linear"/></g>
                <g transform="translate(180 44)"><rect x="-74" y="-17" width="148" height="30" rx="8" fill="var(--shadow)" transform="translate(3 3)"/><rect x="-74" y="-17" width="148" height="30" rx="8" fill="var(--card)" stroke="var(--stroke)" stroke-width="2"/><text y="3" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="600" fill="var(--ink)">allow tcp:80 ✓</text></g>
                <rect x="24" y="196" width="22" height="22" rx="4" fill="var(--lilac)" stroke="var(--stroke)" stroke-width="2"/><rect x="52" y="204" width="14" height="14" rx="3" fill="var(--rose)" stroke="var(--stroke)" stroke-width="2"/>
                <circle cx="326" cy="206" r="12" fill="var(--mustard)" stroke="var(--stroke)" stroke-width="2"/><path d="M300 34l14-14 14 14z" fill="var(--lilac)" stroke="var(--stroke)" stroke-width="2" stroke-linejoin="round"/>
              </svg>
            </div>
          </section>

          <!-- stats -->
          <section class="mt-6 grid grid-cols-3 gap-3 sm:gap-4" aria-label="Your progress">
            <div class="brut bg-mustard p-4 text-on-swatch"><div class="font-mono text-3xl font-bold sm:text-4xl" x-text="String(model.stats.total).padStart(2, '0')"></div><div class="label-mono !text-on-swatch/75">Topics</div></div>
            <div class="brut bg-lilac p-4 text-on-swatch"><div class="font-mono text-3xl font-bold sm:text-4xl" x-text="String(model.stats.started).padStart(2, '0')"></div><div class="label-mono !text-on-swatch/75">In progress</div></div>
            <div class="brut bg-mint p-4 text-on-swatch"><div class="font-mono text-3xl font-bold sm:text-4xl" x-text="String(model.stats.done).padStart(2, '0')"></div><div class="label-mono !text-on-swatch/75">Completed</div></div>
          </section>

          <!-- my modules -->
          <section id="my-modules" class="mt-12 scroll-mt-24" aria-labelledby="my-modules-title">
            <div class="mb-4 flex flex-wrap items-center gap-3">
              <h2 id="my-modules-title" class="font-mono text-2xl font-bold">My modules</h2>
              <span class="chip bg-card text-ink-soft" x-text="moduleCards.length + (moduleCards.length === 1 ? ' module' : ' modules')"></span>
              <span class="h-0.5 min-w-8 flex-1 bg-stroke/30"></span>
              <label class="btn btn-sm">Import module<input type="file" accept=".json,application/json" class="sr-only" aria-label="Import module file" @change="pickModule($event)"></label>
            </div>
            <template x-if="!moduleCards.length">
              <div class="rounded-xl border-2 border-dashed border-stroke/60 p-6 text-center text-ink-soft">
                <p class="font-mono font-bold text-ink">No modules yet</p>
                <p class="mt-1 text-sm">Open a share link, use <b>Import module</b>, or drop a <span class="font-mono">.visilearn.json</span> file anywhere on this page.</p>
              </div>
            </template>
            <div class="grid gap-5 lg:grid-cols-2">
              <template x-for="m in moduleCards" :key="m.id">
                <article class="brut flex flex-col overflow-hidden bg-card">
                  <header class="win-bar text-on-swatch" :class="'bg-' + m.swatch">
                    <span class="win-dots"><i class="bg-card"></i></span>
                    <span class="flex-1 truncate" x-text="m.id + '.visilearn.json'"></span>
                    <span class="chip border-on-swatch/60 bg-card/60" x-text="m.pct + '%'"></span>
                  </header>
                  <div class="flex flex-1 flex-col gap-3 p-4">
                    <div>
                      <h3 class="font-mono text-lg font-bold" x-text="m.title"></h3>
                      <p class="text-sm text-ink-soft" x-show="m.author" x-text="'by ' + m.author"></p>
                      <p class="mt-1 text-sm" x-show="m.description" x-text="m.description"></p>
                      <p class="mt-1 font-mono text-xs text-ink-soft" x-show="m.sources.length" x-text="'source: ' + m.sources.join('; ')"></p>
                      <div class="mt-2 flex flex-wrap gap-1.5" x-show="m.packs.length">
                        <template x-for="p in m.packs" :key="p.name"><span class="chip bg-lilac text-on-swatch" :title="p.about" x-text="'pack: ' + p.name"></span></template>
                      </div>
                    </div>
                    <ol class="flex flex-col gap-1.5">
                      <template x-for="(l, i) in m.lessons" :key="l.key">
                        <li><a :href="'#/s/' + l.key" class="brut-flat flex items-center gap-3 bg-card-2 px-3 py-2 text-sm hover:bg-card">
                          <span class="font-mono text-xs font-bold text-ink-soft" x-text="String(i + 1).padStart(2, '0')"></span>
                          <span class="flex-1 font-medium" x-text="l.title"></span>
                          <span class="font-mono text-xs text-ink-soft" x-text="l.pct === 100 ? 'done ✓' : l.steps + ' steps'"></span>
                        </a></li>
                      </template>
                    </ol>
                    <template x-if="m.errors.length">
                      <ul class="ml-4 list-disc font-mono text-xs text-bad"><template x-for="e in m.errors.slice(0, 4)"><li x-text="e"></li></template></ul>
                    </template>
                    <div class="mt-auto flex flex-wrap gap-2 pt-1">
                      <button class="btn btn-sm" @click="exportModule(m.id)">Export</button>
                      <button class="btn btn-sm" @click="shareModule(m.id)">Share link</button>
                      <button class="btn btn-sm ml-auto" :class="deleteArmed === m.id && '!bg-rose text-on-swatch'" @click="deleteModule(m.id)"
                        x-text="deleteArmed === m.id ? 'Click again to delete' : 'Delete'"></button>
                    </div>
                    <template x-if="share.id === m.id">
                      <div class="brut-flat bg-card-2 p-3">
                        <p class="text-sm" x-text="share.note" aria-live="polite"></p>
                        <input class="field mt-2" readonly aria-label="Share link" x-show="share.url" :value="share.url" @focus="$el.select()">
                      </div>
                    </template>
                  </div>
                </article>
              </template>
            </div>
          </section>

          <!-- how it works -->
          <section id="how" class="mt-12 scroll-mt-24">
            <h2 class="label-mono mb-4">How it works</h2>
            <ol class="grid gap-4 md:grid-cols-3">
              <template x-for="(s, i) in [
                  { t: 'Watch', d: 'Each step animates one idea: a packet travels, a device fails, a rule matches.', c: 'bg-sky' },
                  { t: 'Predict', d: 'Before the answer is shown, you commit to a guess. Wrong guesses teach the most.', c: 'bg-rose' },
                  { t: 'Try', d: 'Challenges hand you the controls: edit rules, send packets, hit the goals.', c: 'bg-peach' }]" :key="s.t">
                <li class="brut flex gap-4 bg-card p-4">
                  <span class="brut-sm grid h-11 w-11 shrink-0 place-items-center font-mono text-lg font-bold text-on-swatch" :class="s.c" x-text="'0' + (i + 1)"></span>
                  <div><h3 class="font-mono font-bold" x-text="s.t"></h3><p class="text-sm text-ink-soft" x-text="s.d"></p></div>
                </li>
              </template>
            </ol>
          </section>

          <!-- tracks -->
          <div id="topics" class="scroll-mt-24">
            <template x-for="track in model.tracks" :key="track.key">
              <section class="mt-12">
                <div class="mb-4 flex items-center gap-3">
                  <h2 class="font-mono text-2xl font-bold" x-text="track.name"></h2>
                  <span class="chip bg-card text-ink-soft" x-text="track.cards.length + ' scenes'"></span>
                  <span class="h-0.5 flex-1 bg-stroke/30"></span>
                </div>
                <div class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3">
                  <template x-for="card in track.cards" :key="card.id">
                    <a :href="'#/s/' + card.id" class="brut group flex flex-col overflow-hidden bg-card transition-transform duration-150 hover:-translate-x-0.5 hover:-translate-y-0.5">
                      <div class="relative flex h-24 items-start justify-between border-b-2 border-stroke p-3 text-on-swatch stripes" :class="'bg-' + card.swatch">
                        <span class="chip border-on-swatch/50 bg-card/60" x-text="card.steps + ' steps'"></span>
                        <span class="chip border-on-swatch/50 bg-card/60" x-show="card.status !== 'new'" x-text="card.status === 'done' ? 'done ✓' : card.pct + '%'"></span>
                      </div>
                      <div class="flex flex-1 flex-col gap-3 p-4">
                        <h3 class="font-mono text-lg font-bold leading-snug" x-text="card.title"></h3>
                        <p class="flex-1 text-sm text-ink-soft" x-text="card.about"></p>
                        <div class="meter" role="progressbar" :aria-valuenow="card.pct" aria-valuemin="0" aria-valuemax="100" :aria-label="card.title + ' progress'">
                          <span :class="'bg-' + card.swatch" :style="'width:' + card.pct + '%'" x-show="card.pct > 0"></span>
                        </div>
                        <span class="brut-sm flex items-stretch overflow-hidden font-mono text-sm font-bold">
                          <span class="flex-1 px-3 py-2 uppercase tracking-wider" x-text="card.cta"></span>
                          <span class="grid w-11 place-items-center border-l-2 border-stroke text-on-swatch transition-colors" :class="'bg-' + card.swatch">→</span>
                        </span>
                      </div>
                    </a>
                  </template>
                </div>
              </section>
            </template>

            <!-- roadmap -->
            <section class="mt-12" x-show="upcoming.length">
              <div class="mb-4 flex items-center gap-3">
                <h2 class="font-mono text-2xl font-bold">Coming soon</h2>
                <span class="h-0.5 flex-1 bg-stroke/30"></span>
              </div>
              <div class="grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-5">
                <template x-for="t in upcoming" :key="t.key">
                  <div class="rounded-xl border-2 border-dashed border-stroke/60 p-4 text-ink-soft">
                    <div class="font-mono font-bold text-ink" x-text="t.name"></div>
                    <div class="label-mono mt-1">in the lab</div>
                  </div>
                </template>
              </div>
            </section>

            <!-- broken scenes (author feedback) -->
            <template x-if="model.broken.length">
              <section class="brut mt-12 bg-card p-5">
                <h2 class="font-mono font-bold text-bad">Scenes with errors</h2>
                <template x-for="b in model.broken" :key="b.file">
                  <div class="mt-3"><div class="font-mono text-sm font-bold" x-text="b.file"></div>
                    <ul class="ml-4 list-disc font-mono text-xs text-bad"><template x-for="e in b.errors"><li x-text="e"></li></template></ul></div>
                </template>
              </section>
            </template>
          </div>

          <!-- progress tools -->
          <footer class="brut mt-14 flex flex-wrap items-center gap-4 bg-card-2 p-5">
            <div class="min-w-60 flex-1">
              <div class="font-mono font-bold">Your progress lives on this device.</div>
              <p class="text-sm text-ink-soft">No account, no server. Export a file to back up or move to another browser.</p>
            </div>
            <div class="flex flex-wrap gap-2">
              <button class="btn btn-sm" @click="exportProgress()">Export</button>
              <label class="btn btn-sm">Import<input type="file" accept="application/json,.json" class="sr-only" @change="importProgress($event)"></label>
              <button class="btn btn-sm" :class="resetArmed && '!bg-rose text-on-swatch'" @click="resetProgress()" x-text="resetArmed ? 'Click again to erase' : 'Reset'"></button>
            </div>
            <p class="w-full font-mono text-xs text-ink-soft" x-show="message" x-text="message" aria-live="polite"></p>
          </footer>
        </div>
      </template>

      <!-- ================= STUDIO ================= -->
      <template x-if="$store.route.view === 'studio'">
        <div x-data="studio" class="mx-auto max-w-7xl px-4 pb-16 pt-8 sm:px-6">
          <div class="mb-2 flex flex-wrap items-center gap-3">
            <a href="#/" class="btn btn-icon" aria-label="Back to all topics">←</a>
            <h1 class="font-mono text-2xl font-bold">Studio</h1>
            <span class="chip bg-card text-ink-soft">beta</span>
            <a href="#/settings" class="ml-auto chip" :class="model.ok ? 'bg-mint text-on-swatch' : 'bg-rose text-on-swatch'"
              x-text="model.ok ? model.label + ' · ' + model.model : 'choose an AI model →'"></a>
          </div>
          <p class="mb-6 max-w-3xl text-ink-soft">Turn your own files into an interactive module. The AI drafts; the compiler checks every line; you review, edit and save.</p>

          <div class="grid items-start gap-5 lg:grid-cols-[minmax(0,1fr)_340px]">
            <div class="flex min-w-0 flex-col gap-5">
              <!-- 1 sources -->
              <section class="brut overflow-hidden bg-card">
                <header class="win-bar bg-sky text-on-swatch"><span class="font-bold">1</span><span class="flex-1">Sources</span>
                  <span class="chip border-on-swatch/60 bg-card/60" x-text="selectedCount + ' chapters selected'"></span></header>
                <div class="flex flex-col gap-3 p-5">
                  <label class="flex cursor-pointer flex-col items-center gap-1 rounded-xl border-2 border-dashed border-stroke/60 p-5 text-center hover:bg-card-2"
                    @dragover.prevent @drop.prevent="addFiles($event.dataTransfer.files)">
                    <span class="font-mono font-bold">Pick or drop files</span>
                    <span class="text-sm text-ink-soft">PDF, Markdown or text. Files are read in your browser and never uploaded.</span>
                    <input type="file" multiple class="sr-only" :accept="accept" aria-label="Source files" @change="addFiles($event.target.files); $event.target.value = ''">
                  </label>
                  <template x-for="f in files" :key="f.id">
                    <div class="brut-flat bg-card-2 p-3">
                      <div class="flex items-center gap-2">
                        <span class="flex-1 truncate font-mono text-sm font-bold" x-text="f.name"></span>
                        <span class="font-mono text-xs text-ink-soft" x-show="f.status === 'reading'" x-text="'reading… ' + f.progress"></span>
                        <span class="font-mono text-xs text-ink-soft" x-show="f.status === 'ready'" x-text="f.pages + ' pages · ' + f.chapters.length + ' chapters'"></span>
                        <button class="btn btn-sm" x-show="f.status === 'ready'" @click="selectAll(f, true)">All</button>
                        <button class="btn btn-sm" x-show="f.status === 'ready'" @click="selectAll(f, false)">None</button>
                        <button class="btn btn-sm" @click="removeFile(f.id)" aria-label="Remove file">✕</button>
                      </div>
                      <p class="mt-1 font-mono text-xs text-bad" x-show="f.error" x-text="f.error"></p>
                      <div class="mt-2 grid max-h-56 gap-1 overflow-y-auto sm:grid-cols-2" x-show="f.chapters.length">
                        <template x-for="c in f.chapters" :key="c.key">
                          <label class="flex cursor-pointer items-center gap-2 rounded-md px-2 py-1 text-sm hover:bg-card" :class="c.selected && 'bg-card'">
                            <input type="checkbox" x-model="c.selected" class="accent-[var(--ink)]" :aria-label="c.title">
                            <span class="flex-1 truncate" x-text="c.title"></span>
                            <span class="font-mono text-[11px] text-ink-soft" x-text="'p.' + c.page"></span>
                          </label>
                        </template>
                      </div>
                    </div>
                  </template>
                  <label class="flex flex-col gap-1"><span class="label-mono">Topic</span>
                    <input class="field" aria-label="Topic" x-model="topic" placeholder="e.g. Git, SQL, DNS"></label>
                </div>
              </section>

              <!-- 2 pack -->
              <section class="brut overflow-hidden bg-card">
                <header class="win-bar bg-lilac text-on-swatch"><span class="font-bold">2</span><span class="flex-1">Topic pack: the things the lessons can draw</span>
                  <span class="chip border-on-swatch/60 bg-card/60" x-show="pack.name" x-text="'pack: ' + pack.name"></span></header>
                <div class="flex flex-col gap-3 p-5">
                  <div class="flex flex-wrap items-end gap-3">
                    <label class="flex min-w-56 flex-1 flex-col gap-1"><span class="label-mono">Pack</span>
                      <select class="field" aria-label="Pack" x-model="packMode">
                        <option value="new">Create a new pack from the sources</option>
                        <template x-for="b in builtins" :key="b"><option :value="b" x-text="'Use built-in: ' + b"></option></template>
                      </select></label>
                    <button class="btn btn-primary" @click="makePack()" :disabled="!!busy || !selectedCount" x-text="busy === 'pack' ? 'Designing…' : (packMode === 'new' ? 'Design pack' : 'Use pack')"></button>
                  </div>
                  <template x-if="pack.source">
                    <div>
                      <textarea class="field min-h-48 font-mono text-xs" aria-label="Pack source" spellcheck="false" :value="pack.source" @input="editPack($event.target.value)"></textarea>
                      <p class="mt-1 font-mono text-xs" :class="pack.status === 'ok' ? 'text-ok' : 'text-bad'"
                        x-text="pack.status === 'ok' ? '✓ valid pack' + (pack.attempts > 1 ? ' (fixed in ' + pack.attempts + ' attempts)' : '') : pack.errors.slice(0, 3).join(' · ')"></p>
                    </div>
                  </template>
                </div>
              </section>

              <!-- 3 outline -->
              <section class="brut overflow-hidden bg-card">
                <header class="win-bar bg-mustard text-on-swatch"><span class="font-bold">3</span><span class="flex-1">Lesson plan</span></header>
                <div class="flex flex-col gap-3 p-5">
                  <div class="flex flex-wrap items-end gap-3">
                    <label class="flex flex-col gap-1"><span class="label-mono">Lessons</span>
                      <select class="field" aria-label="Number of lessons" x-model="maxLessons"><template x-for="n in [1,2,3,4,5,6]"><option :value="n" x-text="n"></option></template></select></label>
                    <button class="btn btn-primary" @click="makeOutline()" :disabled="!!busy || pack.status !== 'ok'" x-text="busy === 'outline' ? 'Planning…' : 'Plan lessons'"></button>
                  </div>
                  <template x-for="(o, i) in outline" :key="i">
                    <div class="brut-flat flex items-start gap-3 bg-card-2 p-3" :class="!o.keep && 'opacity-50'">
                      <input type="checkbox" x-model="o.keep" class="mt-2 accent-[var(--ink)]" :aria-label="'Keep lesson ' + (i + 1)">
                      <div class="flex min-w-0 flex-1 flex-col gap-1">
                        <input class="field font-bold" x-model="o.title" :aria-label="'Lesson ' + (i + 1) + ' title'">
                        <input class="field text-sm" x-model="o.about" :aria-label="'Lesson ' + (i + 1) + ' goal'">
                        <span class="font-mono text-[11px] text-ink-soft" x-text="o.key_concepts.join(' · ')"></span>
                      </div>
                    </div>
                  </template>
                  <button class="btn btn-primary self-start" x-show="outline.length" @click="writeLessons()" :disabled="!!busy" x-text="busy === 'lessons' ? 'Writing…' : 'Write lessons'"></button>
                </div>
              </section>

              <!-- 4 lessons -->
              <section class="brut overflow-hidden bg-card" x-show="lessons.length">
                <header class="win-bar bg-mint text-on-swatch"><span class="font-bold">4</span><span class="flex-1">Lessons</span>
                  <span class="chip border-on-swatch/60 bg-card/60" x-text="okLessons.length + ' / ' + lessons.length + ' ready'"></span></header>
                <div class="flex flex-col gap-3 p-5">
                  <template x-for="(l, i) in lessons" :key="i">
                    <div data-test="lesson" class="brut-flat bg-card-2 p-3">
                      <div class="flex flex-wrap items-center gap-2">
                        <span class="chip" :class="{ 'bg-mint text-on-swatch': l.status === 'ok', 'bg-rose text-on-swatch': l.status === 'failed', 'bg-card': l.status === 'queued' || l.status === 'working' }" x-text="l.status"></span>
                        <span class="flex-1 font-bold" x-text="l.title"></span>
                        <span class="font-mono text-[11px] text-ink-soft" x-show="l.attempts > 1" x-text="l.attempts + ' attempts'"></span>
                        <button class="btn btn-sm" x-show="l.status === 'ok'" @click="save(l.sceneId)">Save &amp; preview</button>
                        <button class="btn btn-sm" x-show="l.status === 'failed' || l.status === 'ok'" @click="retryLesson(i)" :disabled="!!busy">Rewrite</button>
                      </div>
                      <ul class="mt-2 ml-4 list-disc font-mono text-xs text-bad" x-show="l.errors.length"><template x-for="e in l.errors.slice(0, 5)"><li x-text="e"></li></template></ul>
                      <details class="mt-2" x-show="l.source"><summary class="cursor-pointer font-mono text-xs">Lesson source</summary>
                        <textarea class="field mt-2 min-h-56 font-mono text-xs" spellcheck="false" :aria-label="'Lesson ' + (i + 1) + ' source'" :value="l.source" @input.debounce.400ms="editLesson(i, $event.target.value)"></textarea>
                      </details>
                    </div>
                  </template>
                </div>
              </section>

              <!-- 5 save -->
              <section class="brut overflow-hidden bg-card" x-show="okLessons.length">
                <header class="win-bar bg-peach text-on-swatch"><span class="font-bold">5</span><span class="flex-1">Save as a module</span></header>
                <div class="grid gap-3 p-5 sm:grid-cols-2">
                  <label class="flex flex-col gap-1"><span class="label-mono">Title</span><input class="field" aria-label="Module title" x-model="meta.title"></label>
                  <label class="flex flex-col gap-1"><span class="label-mono">Author</span><input class="field" aria-label="Author" x-model="meta.author"></label>
                  <label class="flex flex-col gap-1 sm:col-span-2"><span class="label-mono">Description</span><input class="field" aria-label="Description" x-model="meta.description"></label>
                  <div class="flex flex-wrap items-center gap-2 sm:col-span-2">
                    <button class="btn btn-primary" @click="save()">Save to My modules</button>
                    <a href="#/" class="btn" x-show="moduleId">Open My modules →</a>
                    <span class="text-xs text-ink-soft">Sources and pages are recorded in the module. Lessons explain the material in their own words.</span>
                  </div>
                </div>
              </section>
            </div>

            <!-- activity -->
            <aside class="flex min-w-0 flex-col gap-3 lg:sticky lg:top-20">
              <section class="brut overflow-hidden bg-card">
                <header class="win-bar bg-card-2"><span class="win-dots"><i class="bg-card"></i></span><span class="flex-1">activity</span>
                  <button class="btn btn-sm" x-show="busy" @click="stop()">Stop</button></header>
                <div class="term-screen max-h-[60vh] min-h-40 overflow-y-auto px-4 py-3 font-mono text-[12px]" aria-live="polite">
                  <p class="term-prompt" x-show="live" x-text="live"></p>
                  <p class="term-err" x-show="error" x-text="error"></p>
                  <template x-for="l in log" :key="l.id"><p :class="{ 'term-err': l.tone === 'bad', 'term-dim': l.tone === 'info' }" x-text="l.text"></p></template>
                  <p class="term-dim" x-show="!log.length && !live">Steps: add files → select chapters → design pack → plan → write → save.</p>
                </div>
              </section>
            </aside>
          </div>
        </div>
      </template>

      <!-- ================= AI SETTINGS ================= -->
      <template x-if="$store.route.view === 'settings'">
        <div x-data="aiSettings" class="mx-auto max-w-6xl px-4 pb-16 pt-8 sm:px-6">
          <div class="mb-2 flex items-center gap-3">
            <a href="#/" class="btn btn-icon" aria-label="Back to all topics">←</a>
            <h1 class="font-mono text-2xl font-bold">AI models</h1>
          </div>
          <p class="mb-6 max-w-3xl text-ink-soft">Connect the model that will turn your files into lessons. <b class="text-ink">Local models are preferred:</b> nothing leaves your computer. Cloud providers receive the text you send them.</p>

          <div class="grid items-start gap-5 lg:grid-cols-[300px_minmax(0,1fr)]">
            <!-- provider list -->
            <aside class="flex flex-col gap-3">
              <template x-for="p in providers" :key="p.id">
                <button data-test="provider" :data-active="p.id === activeId" @click="select(p.id)"
                  class="brut-sm flex flex-col items-start gap-1 bg-card px-3 py-2.5 text-left transition-transform hover:-translate-y-0.5"
                  :class="p.id === selId && '!bg-card-2 outline-2 outline-dashed outline-offset-2 outline-stroke'">
                  <span class="flex w-full items-center gap-2">
                    <span class="provider-name flex-1 font-mono font-bold" x-text="p.label"></span>
                    <span class="chip bg-mint text-on-swatch" x-show="p.id === activeId">active</span>
                  </span>
                  <span class="font-mono text-xs text-ink-soft" x-text="p.model || 'no model chosen'"></span>
                  <span class="truncate font-mono text-[11px] text-ink-soft/80" x-text="p.baseUrl"></span>
                </button>
              </template>
              <div data-test="presets" class="mt-2 flex flex-col gap-1.5">
                <span class="label-mono">Add a provider</span>
                <template x-for="pr in presets" :key="pr.key">
                  <button class="btn btn-sm justify-start" @click="add(pr.key)" :title="pr.note" x-text="'+ ' + pr.label"></button>
                </template>
              </div>
            </aside>

            <!-- editor -->
            <template x-if="sel">
              <div class="flex min-w-0 flex-col gap-5">
                <section class="brut overflow-hidden bg-card">
                  <header class="win-bar text-on-swatch" :class="local ? 'bg-mint' : 'bg-peach'">
                    <span class="win-dots"><i class="bg-card"></i></span>
                    <span class="flex-1 truncate" x-text="sel.label"></span>
                    <span class="chip border-on-swatch/60 bg-card/60" x-text="local ? 'local' : 'cloud'"></span>
                  </header>
                  <div class="grid gap-4 p-5 sm:grid-cols-2">
                    <label class="flex min-w-0 flex-col gap-1"><span class="label-mono">Name</span>
                      <input class="field" aria-label="Name" :value="sel.label" @input="field('label', $event.target.value)"></label>
                    <label class="flex min-w-0 flex-col gap-1"><span class="label-mono">Base URL</span>
                      <input class="field" aria-label="Base URL" spellcheck="false" :value="sel.baseUrl" @input="field('baseUrl', $event.target.value)"></label>
                    <label class="flex min-w-0 flex-col gap-1 sm:col-span-2"><span class="label-mono">Model</span>
                      <select class="field" aria-label="Model" @change="field('model', $event.target.value)">
                        <option value="" :selected="!sel.model">(test connection to list models)</option>
                        <template x-for="m in modelOptions" :key="m.id">
                          <option :value="m.id" :selected="m.id === sel.model" x-text="m.id + (m.detail ? '  ·  ' + m.detail : '')"></option>
                        </template>
                      </select>
                    </label>
                    <template x-if="needsKey">
                      <label class="flex min-w-0 flex-col gap-1 sm:col-span-2"><span class="label-mono">API key</span>
                        <input class="field" type="password" aria-label="API key" autocomplete="off" :value="sel.apiKey ?? ''" @input="field('apiKey', $event.target.value)">
                        <span class="text-xs text-ink-soft">The key is stored only in this browser and is never exported or shared. Anything running on this page can read it, so use a key you can revoke.</span>
                      </label>
                    </template>
                    <div class="flex flex-wrap gap-2 sm:col-span-2">
                      <button class="btn btn-primary" @click="test()" :disabled="testing === sel.id" x-text="testing === sel.id ? 'Testing…' : 'Test connection'"></button>
                      <button class="btn" @click="use()" :disabled="sel.id === activeId">Use this provider</button>
                      <button class="btn ml-auto" :class="removeArmed === sel.id && '!bg-rose text-on-swatch'" @click="remove(sel.id)" x-text="removeArmed === sel.id ? 'Click again to remove' : 'Remove'"></button>
                    </div>
                    <div data-test="report" class="sm:col-span-2" aria-live="polite">
                      <template x-if="report && report.ok">
                        <p class="brut-flat bg-mint px-3 py-2 font-mono text-sm text-on-swatch" x-text="'✓ ' + report.summary"></p>
                      </template>
                      <template x-if="report && !report.ok">
                        <div class="brut-flat bg-rose/40 px-3 py-2">
                          <p class="font-mono text-sm font-bold" x-text="report.message"></p>
                          <template x-if="report.fix">
                            <div class="mt-2">
                              <pre class="overflow-x-auto whitespace-pre-wrap rounded-md bg-card px-3 py-2 font-mono text-xs" x-text="report.fix"></pre>
                              <button class="btn btn-sm mt-2" @click="copy(report.fix)" x-text="copied ? 'Copied' : 'Copy'"></button>
                            </div>
                          </template>
                          <p class="mt-1 text-xs text-ink-soft" x-show="report.code === 'cors'">Browsers block web pages from talking to local servers unless the server allows it (CORS).</p>
                        </div>
                      </template>
                    </div>
                  </div>
                </section>

                <!-- try it -->
                <section class="brut overflow-hidden bg-card">
                  <header class="win-bar bg-lilac text-on-swatch">
                    <span class="win-dots"><i class="bg-card"></i></span>
                    <span class="flex-1">try-a-prompt</span>
                    <span class="chip border-on-swatch/60 bg-card/60" x-show="stats" x-text="stats"></span>
                  </header>
                  <div class="flex flex-col gap-3 p-5">
                    <textarea class="field min-h-20" aria-label="Prompt" :value="prompt" @input="prompt = $event.target.value"></textarea>
                    <div class="flex flex-wrap gap-2">
                      <button class="btn btn-primary" @click="send(false)" :disabled="busy || !sel.model">Send</button>
                      <button class="btn" @click="send(true)" :disabled="busy || !sel.model">Check JSON output</button>
                      <button class="btn" @click="stop()" x-show="busy">Stop</button>
                    </div>
                    <pre data-test="output" class="term-screen min-h-24 overflow-x-auto whitespace-pre-wrap rounded-lg px-4 py-3 font-mono text-[13px]" x-text="output || (busy ? (thinking ? 'The model is thinking… (' + thinking + ' characters of reasoning)' : '…') : 'The reply will stream here.')"></pre>
                    <p class="font-mono text-sm text-bad" x-show="error" x-text="error"></p>
                  </div>
                </section>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- ================= IMPORT ================= -->
      <template x-if="$store.route.view === 'import'">
        <div x-data="importer($store.route.payload)" class="mx-auto max-w-3xl px-4 pb-16 pt-8 sm:px-6">
          <div class="mb-5 flex items-center gap-3">
            <a href="#/" class="btn btn-icon" aria-label="Back to all topics">←</a>
            <h1 class="font-mono text-2xl font-bold">Import a module</h1>
          </div>
          <p x-show="loading" class="font-mono text-ink-soft">Reading module…</p>
          <template x-if="!loading && !check">
            <div class="brut bg-card p-6">
              <p class="font-mono font-bold">Nothing to import.</p>
              <p class="mt-1 text-sm text-ink-soft">Open a share link, or use <b>Import module</b> on the home page.</p>
            </div>
          </template>
          <template x-if="!loading && check">
            <section class="brut overflow-hidden bg-card">
              <header class="win-bar text-on-swatch" :class="check.module ? 'bg-mint' : 'bg-rose'">
                <span class="win-dots"><i class="bg-card"></i></span>
                <span class="flex-1 truncate" x-text="check.module ? check.module.id + '.visilearn.json' : 'module'"></span>
                <span class="chip border-on-swatch/60 bg-card/60" x-text="check.module ? 'valid' : 'has problems'"></span>
              </header>
              <div class="p-5">
                <template x-if="check.module">
                  <div>
                    <h2 class="font-mono text-xl font-bold" x-text="check.module.title"></h2>
                    <p class="text-sm text-ink-soft" x-show="check.module.author" x-text="'by ' + check.module.author"></p>
                    <p class="mt-2" x-show="check.module.description" x-text="check.module.description"></p>
                    <p class="mt-1 font-mono text-xs text-ink-soft" x-show="check.module.sources.length"
                      x-text="'source: ' + check.module.sources.map((s) => s.pages ? s.title + ', ' + s.pages : s.title).join('; ')"></p>
                    <template x-if="packList.length">
                      <div class="brut-flat mt-4 bg-lilac/40 px-3 py-2 text-sm">
                        <p class="font-mono font-bold">Adds new topic vocabulary</p>
                        <template x-for="p in packList" :key="p.name">
                          <p><span class="font-mono font-bold" x-text="p.name"></span>: <span x-text="p.about"></span> <span class="font-mono text-xs text-ink-soft" x-text="'(' + p.kinds.join(', ') + ')'"></span></p>
                        </template>
                        <p class="mt-1 text-xs text-ink-soft">Packs are data only (kinds, icons, macros), never code.</p>
                      </div>
                    </template>
                    <div class="label-mono mt-4 mb-2" x-text="lessons.length + (lessons.length === 1 ? ' lesson' : ' lessons')"></div>
                    <ol class="flex flex-col gap-1.5">
                      <template x-for="(l, i) in lessons" :key="l.id">
                        <li class="brut-flat flex items-center gap-3 bg-card-2 px-3 py-2 text-sm">
                          <span class="font-mono text-xs font-bold text-ink-soft" x-text="String(i + 1).padStart(2, '0')"></span>
                          <span class="flex-1 font-medium" x-text="l.title"></span>
                          <span class="font-mono text-xs text-ink-soft" x-text="l.steps + ' steps'"></span>
                        </li>
                      </template>
                    </ol>
                  </div>
                </template>
                <template x-if="check.errors.length">
                  <div class="mt-2">
                    <p class="font-mono font-bold text-bad">This module can't be imported:</p>
                    <ul class="mt-2 ml-4 list-disc font-mono text-xs text-bad"><template x-for="e in check.errors.slice(0, 12)"><li x-text="e"></li></template></ul>
                  </div>
                </template>
                <template x-if="check.warnings.length">
                  <details class="mt-3 text-sm"><summary class="cursor-pointer font-mono" x-text="check.warnings.length + ' warning(s)'"></summary>
                    <ul class="mt-2 ml-4 list-disc font-mono text-xs text-warn"><template x-for="w in check.warnings.slice(0, 12)"><li x-text="w"></li></template></ul>
                  </details>
                </template>
                <p class="mt-4 text-sm text-ink-soft" x-show="exists">You already have this module. Adding it again replaces your copy (your progress is kept).</p>
                <p class="mt-2 font-mono text-sm text-bad" x-show="error" x-text="error"></p>
                <p class="mt-4 text-xs text-ink-soft">Modules contain lesson text only (no code), checked by the same compiler as built-in lessons.</p>
                <div class="mt-4 flex gap-2">
                  <button class="btn btn-primary" @click="add()" :disabled="!check.module || saving">Add to My modules</button>
                  <a href="#/" class="btn">Cancel</a>
                </div>
              </div>
            </section>
          </template>
        </div>
      </template>

      <!-- ================= PLAYER ================= -->
      <template x-if="$store.route.view === 'player'">
        <div>
          <template x-for="sid in [$store.route.id]" :key="sid">
            <div x-data="player(sid)" class="mx-auto max-w-7xl px-4 pb-16 pt-5 sm:px-6">
              <template x-if="!found">
                <div class="brut mt-10 bg-card p-8 text-center">
                  <h1 class="font-mono text-2xl font-bold">Topic not found</h1>
                  <a href="#/" class="btn btn-primary mt-4">← Back to all topics</a>
                </div>
              </template>

              <div x-show="found">
                <!-- title row -->
                <div class="mb-5 flex flex-wrap items-center gap-3">
                  <a href="#/" class="btn btn-icon" aria-label="Back to all topics">←</a>
                  <h1 class="min-w-0 flex-1 font-mono text-xl font-bold sm:text-2xl" x-text="title"></h1>
                  <div class="seg" role="group" aria-label="Animation speed">
                    <template x-for="s in [0.5, 1, 2]" :key="s">
                      <button :aria-pressed="speed === s" @click="setSpeed(s)" x-text="s + '×'"></button>
                    </template>
                  </div>
                </div>

                <div class="grid items-start gap-5 lg:grid-cols-[minmax(0,1fr)_400px]">
                  <!-- left: stage + log -->
                  <div class="flex min-w-0 flex-col gap-5">
                    <section class="brut overflow-hidden bg-card">
                      <header class="win-bar bg-mustard text-on-swatch">
                        <span class="win-dots"><i class="bg-rose"></i><i class="bg-mint"></i><i class="bg-sky"></i></span>
                        <span class="flex-1 truncate" x-text="sid + '.scene'"></span>
                        <span class="chip border-on-swatch/60 bg-card/60"><span class="h-2 w-2 animate-pulse rounded-full bg-bad"></span>live</span>
                      </header>
                      <div class="grid-paper overflow-x-auto p-2 sm:p-4" x-ref="stage"></div>
                      <footer class="flex flex-wrap gap-x-5 gap-y-1 border-t-2 border-stroke bg-card-2 px-3 py-2 font-mono text-[11px] text-ink-soft">
                        <template x-for="l in legend" :key="l.label"><span class="flex items-center gap-1.5"><i class="h-3 w-3" :class="l.dot"></i><span x-text="l.label"></span></span></template>
                        <span class="ml-auto hidden sm:inline">click anything to inspect it</span>
                      </footer>
                    </section>

                    <div x-show="mainPanels" x-html="mainPanels"></div>
                    <section class="brut overflow-hidden bg-card" x-show="!mainPanels">
                      <header class="win-bar bg-card-2"><span class="win-dots"><i class="bg-card"></i></span><span>event.log</span></header>
                      <ol class="max-h-52 overflow-auto px-4 py-2 font-mono text-[12.5px]" aria-live="polite">
                        <li x-show="!log.length" class="py-1 text-ink-soft">$ waiting for events…</li>
                        <template x-for="l in log" :key="l.id">
                          <li class="border-b border-dashed border-stroke/30 py-1"
                            :class="{ 'text-ok': l.tone === 'ok', 'text-bad': l.tone === 'bad', 'text-warn': l.tone === 'warn' }" x-text="l.msg"></li>
                        </template>
                      </ol>
                    </section>
                  </div>

                  <!-- right: lesson -->
                  <aside class="flex min-w-0 flex-col gap-5 lg:sticky lg:top-20">
                    <section class="brut bg-card p-5">
                      <!-- step tracker -->
                      <ol class="mb-5 flex items-center" aria-label="Steps">
                        <template x-for="(s, i) in steps" :key="i">
                          <li class="flex flex-1 items-center last:flex-none">
                            <button class="brut-sm grid h-8 w-8 shrink-0 place-items-center font-mono text-xs font-bold transition-colors"
                              :class="i === idx ? 'bg-mustard text-on-swatch' : done.includes(i) ? 'bg-mint text-on-swatch' : 'bg-card text-ink-soft'"
                              :aria-label="'Step ' + (i + 1) + ': ' + s" :aria-current="i === idx ? 'step' : null" :title="s"
                              @click="go(i)" x-text="done.includes(i) && i !== idx ? '✓' : i + 1"></button>
                            <span class="mx-1 h-0.5 flex-1 bg-stroke/40" x-show="i < steps.length - 1"></span>
                          </li>
                        </template>
                      </ol>

                      <div class="label-mono" x-text="'Step ' + (idx + 1) + ' of ' + steps.length"></div>
                      <h2 class="mt-1 font-mono text-xl font-bold leading-snug" x-text="text"></h2>
                      <template x-for="p in say"><p class="mt-2 text-ink-soft" x-text="p"></p></template>

                      <!-- predict -->
                      <template x-if="ask">
                        <div class="brut-sm mt-4 bg-lilac p-4 text-on-swatch" aria-live="polite">
                          <span class="chip border-on-swatch/60 bg-card/60">Predict</span>
                          <p class="mt-2 font-semibold" x-text="ask.question"></p>
                          <div class="mt-3 flex flex-col gap-2">
                            <template x-for="(o, i) in ask.options" :key="i">
                              <button class="brut-sm flex items-center gap-3 bg-card px-3 py-2 text-left text-sm text-ink transition-transform"
                                :class="{ '!bg-mint !text-on-swatch': o.state === 'right', 'opacity-60 line-through wiggle': o.state === 'wrong', 'hover:-translate-y-0.5 cursor-pointer': o.state === 'idle' }"
                                :disabled="o.state !== 'idle' || ask.tone === 'ok'" @click="answer(i)">
                                <span class="grid h-6 w-6 shrink-0 place-items-center rounded-md border-2 border-stroke font-mono text-xs font-bold" x-text="'ABCDEF'[i]"></span>
                                <span x-text="o.text"></span>
                              </button>
                            </template>
                          </div>
                          <p class="mt-2 min-h-6 font-mono text-sm font-bold" x-text="ask.feedback"></p>
                        </div>
                      </template>

                      <!-- learner controls -->
                      <template x-if="buttons.length">
                        <div class="mt-4">
                          <div class="label-mono mb-2">Try it</div>
                          <div class="flex flex-wrap gap-2">
                            <template x-for="(b, i) in buttons" :key="i">
                              <button class="btn bg-sky text-on-swatch" @click="press(i)" :disabled="b.busy" x-text="b.label"></button>
                            </template>
                          </div>
                        </div>
                      </template>

                      <!-- goals -->
                      <template x-if="goals.length">
                        <div class="mt-4">
                          <div class="label-mono mb-2">Checklist</div>
                          <ul class="flex flex-col gap-2" aria-live="polite">
                            <template x-for="g in goals" :key="g.label">
                              <li class="brut-flat flex items-center gap-3 px-3 py-2 text-sm transition-colors" :class="g.met ? 'bg-mint text-on-swatch' : 'bg-card-2'">
                                <span class="grid h-5 w-5 shrink-0 place-items-center rounded border-2 border-stroke bg-card text-[11px] font-bold text-ink" x-text="g.met ? '✓' : ''"></span>
                                <span class="font-mono" x-text="g.label"></span>
                                <span class="sr-only" x-text="g.met ? '(done)' : '(not yet)'"></span>
                              </li>
                            </template>
                          </ul>
                        </div>
                      </template>

                      <template x-for="h in hints">
                        <details class="mt-3 text-sm">
                          <summary class="cursor-pointer font-mono font-bold">? Show a hint</summary>
                          <p class="brut-flat mt-2 bg-card-2 px-3 py-2 font-mono text-xs" x-text="h"></p>
                        </details>
                      </template>

                      <p class="mt-4 min-h-6 font-mono text-sm font-bold"
                        :class="{ 'text-ok': status.tone === 'done', 'text-ink-soft': status.tone !== 'done' }" x-text="status.text" aria-live="polite"></p>

                      <div class="mt-3 flex gap-2">
                        <button class="btn" @click="go(idx - 1)" :disabled="idx === 0" aria-label="Previous step">←</button>
                        <button class="btn" @click="go(idx)" aria-label="Replay step">↻ Replay</button>
                        <button class="btn btn-primary ml-auto" @click="next()">
                          <span x-text="idx === steps.length - 1 ? 'Finish' : 'Next'"></span><span aria-hidden="true" x-text="idx === steps.length - 1 ? '✓' : '→'"></span>
                        </button>
                      </div>
                    </section>

                    <!-- inspector -->
                    <template x-if="inspector">
                      <section class="brut overflow-hidden bg-card">
                        <header class="win-bar text-on-swatch" :class="'bg-' + inspector.swatch">
                          <span class="win-dots"><i class="bg-card"></i></span>
                          <span class="flex-1 truncate" x-text="inspector.label"></span>
                          <span class="chip border-on-swatch/60 bg-card/60" x-text="inspector.kind"></span>
                          <button class="ml-1 font-bold" @click="closeInspector()" aria-label="Close">✕</button>
                        </header>
                        <div class="p-4 text-sm">
                          <p class="font-mono text-xs text-ink-soft" x-show="inspector.sub && !inspector.details.length" x-text="inspector.sub"></p>
                          <p class="font-mono text-xs text-ink-soft" x-show="inspector.ports" x-text="'listening on ' + inspector.ports"></p>
                          <template x-for="d in inspector.details"><p class="font-mono text-xs text-ink-soft" x-text="d"></p></template>
                          <p class="mt-2" x-text="inspector.about"></p>
                        </div>
                      </section>
                    </template>

                    <!-- pack panels (rules editor, packet lab, …) -->
                    <div x-html="sidePanels"></div>
                  </aside>
                </div>
              </div>
            </div>
          </template>
        </div>
      </template>
    </main>
  </body>
</html>
